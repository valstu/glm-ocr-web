<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/glm-ocr-web/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="GLM-OCR — Run a 0.9B multimodal OCR model locally in your browser via Ollama. Extract text, tables, formulas, and structured data from documents." />
    <title>GLM-OCR // On-Device Document Intelligence</title>
    <script>
      // Register COI service worker for SharedArrayBuffer support on GitHub Pages
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./coi-sw.js').then(reg => {
            if (reg.active && !navigator.serviceWorker.controller) {
              window.location.reload();
            }
          }).catch(() => {});
        });
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
